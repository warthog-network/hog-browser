<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' http://127.0.0.1:* http://localhost:*; font-src http://127.0.0.1:* http://localhost:* data:; img-src http://127.0.0.1:* http://localhost:* data:">
<title>Hog overlay</title>
<style id="hog-base">
  html, body { background: transparent !important; margin: 0 !important; padding: 0 !important;
    width: 100% !important; height: 100% !important; overflow: hidden !important;
    min-height: 0 !important; display: block !important; }
  #root { position: fixed; inset: 0; }
  .menu-wrap { position: absolute; }
  .menu-wrap .hog-copy { position: relative !important; inset: auto !important; left: auto !important;
    right: auto !important; top: auto !important; bottom: auto !important; margin: 0 !important;
    width: 100% !important; height: 100% !important; box-sizing: border-box !important; transform: none !important; }
  button.grip { all: initial; position: absolute; inset: 0; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    background: #fdb913; color: #f4f4f5; border: 0; margin: 0; padding: 0;
    cursor: grab; touch-action: none; user-select: none;
    font: 600 13px/1 'Segoe UI', 'Helvetica Neue', sans-serif; }
  button.grip.tabs { border-radius: 0 8px 8px 0; }
  button.grip.wallet { border-radius: 8px 0 0 8px; }
  button.grip.hot { background: #17181b; border: 1px solid rgba(255,255,255,.14); }
  button.grip.tabs.hot { border-radius: 0 999px 999px 0; border-left: 0; justify-content: flex-start; padding: 0 12px; }
  button.grip.wallet.hot { border-radius: 999px 0 0 999px; border-right: 0; justify-content: flex-end; padding: 0 12px; }
  button.grip.drag, button.grip.drag.hot { background: #fdb913; border: 0; padding: 0; cursor: grabbing; justify-content: center; }
  .dots { width: 9px; height: 9px; display: grid; grid-template-columns: 3px 3px; gap: 3px; }
  .dots i { width: 3px; height: 3px; border-radius: 50%; background: #2a1d05; display: block; }
  button.grip.hot:not(.drag) .dots { display: none; }
  .label { display: none; white-space: nowrap; }
  button.grip.hot:not(.drag) .label { display: block; }
</style>
</head>
<body>
<div id="root"></div>
<script src="overlay.js"></script>
</body>
</html>
