name: Release

on:
  push:
    branches: ["main"]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hog-browser
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev rsync

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Test
        run: |
          npm test
          python3 -m unittest discover -s test -p '*_test.py'

      - name: Build .deb
        run: |
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh

      - name: Read version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Check if release tag already exists
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${VERSION} already exists; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: steps.tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: hog-browser ${{ env.VERSION }}
          files: dist/hog-browser_${{ env.VERSION }}_*.deb
          fail_on_unmatched_files: true
