# Enable IP forwarding so Hog Browser's Tailscale container can act as an
# exit node. accept_ra=2 keeps IPv6 router advertisements even when
# forwarding is on, so this computer does not lose its RA default route.
# Installing this file does not apply it; run: sudo sysctl --system
net.ipv4.ip_forward=1
net.ipv6.conf.all.forwarding=1
net.ipv6.conf.default.forwarding=1
net.ipv6.conf.all.accept_ra=2
net.ipv6.conf.default.accept_ra=2
